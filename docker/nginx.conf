server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # The app shell must always be fresh so new deploys load.
    location ~ ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js)$ {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        include /etc/nginx/snippets/security_headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
